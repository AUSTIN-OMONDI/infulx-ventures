<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin Login – {{ S.store_name }}</title>
  <link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-page">
  <form method="post" class="login-card">
    <img src="{{ url_for('static', filename='img/logo.png') }}" alt="{{ S.store_name }}">
    <h1>Admin Login</h1>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash flash-{{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username<input name="username" required autofocus autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
    <a href="{{ url_for('home') }}" class="back">← Back to website</a>
  </form>
</body>
</html>
