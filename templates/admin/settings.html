{% extends "admin/base.html" %}
{% block title %}Settings{% endblock %}
{% block heading %}Settings{% endblock %}
{% block content %}
<form method="post" class="panel">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <h2>Store details</h2>
  <div class="row2">
    <label>Store name<input name="store_name" value="{{ S.store_name }}"></label>
    <label>Tagline<input name="tagline" value="{{ S.tagline }}"></label>
    <label>Phone 1<input name="phone1" value="{{ S.phone1 }}"></label>
    <label>Phone 2<input name="phone2" value="{{ S.phone2 }}"></label>
    <label>WhatsApp number <small class="muted">receives orders</small><input name="whatsapp" value="{{ S.whatsapp }}" placeholder="0727077377"></label>
    <label>Email <small class="muted">optional</small><input name="email" type="email" value="{{ S.email }}"></label>
    <label>Location<input name="location" value="{{ S.location }}"></label>
    <label>Top bar message<input name="delivery_note" value="{{ S.delivery_note }}"></label>
  </div>
  <h2>M-Pesa payment</h2>
  <div class="row2">
    <label>Paybill number<input name="paybill" value="{{ S.paybill }}" inputmode="numeric"></label>
    <label>Account number<input name="account" value="{{ S.account }}"></label>
  </div>
  <button class="btn btn-primary">💾 Save settings</button>
</form>

<form method="post" class="panel narrow-panel">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input type="hidden" name="form" value="password">
  <h2>Change admin password</h2>
  <label>Current password<input name="current" type="password" required autocomplete="current-password"></label>
  <label>New password<input name="new" type="password" required minlength="6" autocomplete="new-password"></label>
  <label>Confirm new password<input name="confirm" type="password" required minlength="6" autocomplete="new-password"></label>
  <button class="btn btn-primary">Change password</button>
</form>
{% endblock %}
